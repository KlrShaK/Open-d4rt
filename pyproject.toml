[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opend4rt-core"
version = "0.1.0"
description = "Open-d4rt core (src/, infer_track_3d.py), installed editable+--no-deps by consumers such as shak-spatial-agent."
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["infer_track_3d"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
